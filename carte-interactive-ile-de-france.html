<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Carte interactive des transports en commun d'Île-de-France : métro, RER, tramway, Transilien, avec données de population IRIS et création de lignes hypothétiques.">
<meta name="theme-color" content="#1f2933">
<title>Carte interactive des transports en Île-de-France · TransitLab</title>
<link rel="icon" type="image/png" href="assets/transitlab-favicon-32.png">
<link rel="apple-touch-icon" href="assets/transitlab-favicon-180.png">
<link rel="stylesheet" href="assets/leaflet.css">
<link rel="stylesheet" href="assets/map-app.css?v=idf-custom-transport-20261028-darkmode-fix-v3">
<link rel="manifest" href="manifest.json">
</head>
<body>
<div id="map" role="application" aria-label="Carte interactive des transports en Île-de-France"></div>
<aside id="sidebar" class="open" aria-label="Panneau de contrôle">
<header class="sidebar-header">
<h1 class="sidebar-title">TransitLab IDF</h1>
<button id="panelButton" class="panel-toggle" aria-label="Afficher ou masquer le panneau" aria-expanded="true">☰</button>
</header>
<div class="sidebar-content">
<section class="panel-section">
<h2 class="panel-title">Affichage</h2>
<div class="toggle-row">
<label for="darkModeToggle">Mode sombre</label>
<input type="checkbox" id="darkModeToggle">
</div>
<div class="toggle-row">
<label for="populationToggle">Densité de population</label>
<input type="checkbox" id="populationToggle">
</div>
<div class="toggle-row">
<label for="communesBoundaryToggle">Contours des communes</label>
<input type="checkbox" id="communesBoundaryToggle" checked>
</div>
<div class="toggle-row">
<label for="waterToggle">Hydrographie</label>
<input type="checkbox" id="waterToggle">
</div>
</section>
<section class="panel-section" id="populationLegend" hidden>
<h2 class="panel-title">Légende</h2>
<div class="legend-gradient"></div>
<div class="legend-subtitle population-legend-subtitle">Habitants par km²</div>
<div class="legend-note population-legend-note">Survole une commune pour afficher sa densité.</div>
</section>
<section class="panel-section">
<h2 class="panel-title">Ligne hypothétique</h2>
<div class="field-row">
<label for="lineTitle">Nom de la ligne</label>
<input type="text" id="lineTitle" class="field" value="M19" maxlength="32">
</div>
<div class="field-row">
<label for="lineColor">Couleur</label>
<input type="color" id="lineColor" class="field" value="#ec0016">
</div>
<div class="field-row">
<label for="customLineMode">Mode de transport</label>
<select id="customLineMode" class="field">
<option value="Metro">Métro</option>
<option value="RER">RER</option>
<option value="Tramway">Tramway</option>
<option value="Transilien">Transilien</option>
</select>
</div>
<div class="field-row">
<label>Mode</label>
<div id="customModePicker" class="mode-picker">
<button type="button" data-mode="Metro" class="mode-button selected" aria-pressed="true">
<img src="assets/lines-mini/mode-metro.png" alt="Métro" width="18" height="18">
<span>Métro</span>
</button>
<button type="button" data-mode="RER" class="mode-button" aria-pressed="false">
<img src="assets/lines-mini/rer.png" alt="RER" width="18" height="18">
<span>RER</span>
</button>
<button type="button" data-mode="Tramway" class="mode-button" aria-pressed="false">
<img src="assets/lines-mini/tram.png" alt="Tramway" width="18" height="18">
<span>Tramway</span>
</button>
<button type="button" data-mode="Transilien" class="mode-button" aria-pressed="false">
<img src="assets/lines-mini/transilien.png" alt="Transilien" width="18" height="18">
<span>Transilien</span>
</button>
</div>
</div>
<div class="field-row">
<label>Logo</label>
<div class="logo-preview">
<img id="customLogoPreviewImage" src="assets/lines-mini/metro-m1.png" alt="Icône de la ligne" width="32" height="32">
</div>
</div>
<div class="field-row">
<label for="savedLines">Ligne active</label>
<select id="savedLines" class="field"></select>
</div>
<div class="button-row">
<button id="newLineButton" class="button">Nouvelle ligne</button>
<button id="deleteLineButton" class="button danger">Supprimer</button>
</div>
<div class="field-row">
<label for="nextStopName">Nom du prochain arrêt (optionnel)</label>
<input type="text" id="nextStopName" class="field" placeholder="Laisser vide pour nommer automatiquement" maxlength="40">
</div>
<div class="toggle-row">
<label for="snapToStations">Aimant sur les gares existantes</label>
<input type="checkbox" id="snapToStations" checked>
</div>
<div class="button-row">
<button id="drawButton" class="button primary">Commencer le tracé</button>
<button id="undoButton" class="button">Annuler le dernier arrêt</button>
</div>
<div class="toggle-row">
<label for="lineBadgesToggle">Afficher les correspondances</label>
<input type="checkbox" id="lineBadgesToggle" checked>
</div>
<div class="button-row">
<button id="planButton" class="button">Plan schématique</button>
<button id="traceImageButton" class="button">Tracé cartographique</button>
</div>
<div class="button-row">
<button id="exportButton" class="button">Exporter (GeoJSON)</button>
<button id="traceDownloadButton" class="button">Télécharger le tracé</button>
</div>
<div class="field-row">
<label for="importFile">Importer un fichier GeoJSON</label>
<input type="file" id="importFile" accept=".geojson,.json" class="field">
</div>
<div id="stopSummary" class="summary">0 lignes · 0 arrêts · 0 tronçons</div>
<div id="stopList" class="stop-list"></div>
<div id="drawingNote" class="drawing-note">Clique sur la carte pour ajouter des arrêts. Clique à nouveau pour terminer.</div>
</section>
</div>
<div id="saveStatus" class="status"></div>
</aside>
<div id="planModal" class="modal" hidden>
<div class="modal-content">
<h2 class="modal-title">Plan schématique</h2>
<div id="planPreview" class="plan-preview"></div>
<div class="modal-actions">
<button id="planClose" class="button">Fermer</button>
</div>
</div>
</div>
<div id="tracePreviewModal" class="modal" hidden>
<div class="modal-content wide">
<h2 class="modal-title">Tracé cartographique</h2>
<div id="tracePreviewContent" class="trace-preview"></div>
<div class="modal-actions">
<button id="tracePreviewDownload" class="button primary">Télécharger en PNG</button>
<button id="tracePreviewCancel" class="button">Annuler</button>
<button id="tracePreviewClose" class="button">Fermer</button>
</div>
</div>
</div>
<script src="assets/leaflet.js"></script>
<script src="assets/map-boot.js?v=idf-custom-transport-20261028-darkmode-fix-v3" defer></script>
</body>
</html>
