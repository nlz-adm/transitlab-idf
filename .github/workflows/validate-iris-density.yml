name: Validate IRIS density data

on:
  push:
    branches:
      - "perf/iris-label-centers"
    paths:
      - "assets/population-iris-index.json"
      - "assets/population-iris/**"
      - "assets/map-app.js"
      - "assets/map-boot.js"
      - "assets/data-catalog.json"
      - "carte-interactive-ile-de-france.html"
      - "sw.js"
      - "tools/validate-iris-density.py"
      - "tools/test-iris-map-logic.cjs"
      - "tools/test-iris-browser.mjs"
      - ".github/workflows/validate-iris-density.yml"
  pull_request:
    paths:
      - "assets/population-iris-index.json"
      - "assets/population-iris/**"
      - "assets/map-app.js"
      - "assets/map-boot.js"
      - "assets/data-catalog.json"
      - "carte-interactive-ile-de-france.html"
      - "sw.js"
      - "tools/validate-iris-density.py"
      - "tools/test-iris-map-logic.cjs"
      - ".github/workflows/validate-iris-density.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-iris:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Validate compressed IRIS data
        run: python tools/validate-iris-density.py
      - name: Check JavaScript syntax
        run: node --check assets/map-app.js
      - name: Test IRIS density and viewport helpers
        run: node tools/test-iris-map-logic.cjs
      - name: Check JSON data catalog and IRIS index
        run: |
          python -c "import json; json.load(open('assets/data-catalog.json', encoding='utf-8')); json.load(open('assets/population-iris-index.json', encoding='utf-8'))"
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Start local static server
        run: |
          python -m http.server 4173 --bind 127.0.0.1 > /tmp/transitlab-http.log 2>&1 &
          echo $! > /tmp/transitlab-http.pid
          for i in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:4173/carte-interactive-ile-de-france.html > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/transitlab-http.log
          exit 1
      - name: Smoke-test the IRIS map in Chromium
        run: node tools/test-iris-browser.mjs
      - name: Upload IRIS browser screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iris-map-browser-screenshot
          path: /tmp/iris-map-smoke.png
          if-no-files-found: ignore
          retention-days: 7
