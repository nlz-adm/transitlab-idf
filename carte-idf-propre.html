<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Carte des transports – Île-de-France</title>
<link rel="stylesheet" href="assets/leaflet.css">
<style>
  html, body { margin: 0; height: 100%; font-family: system-ui, sans-serif; }
  #map { position: absolute; inset: 0; background: #f4f4f1; }
  #panel {
    position: absolute; top: 12px; right: 12px; z-index: 1000;
    background: #fff; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,.2);
    width: 240px; max-height: calc(100% - 24px); display: flex; flex-direction: column;
  }
  #panel header { padding: 10px 12px; font-weight: 600; border-bottom: 1px solid #eee; }
  #panel input[type=search] { margin: 8px 12px; padding: 6px 8px; border: 1px solid #ccc; border-radius: 4px; }
  #lines { overflow-y: auto; padding: 0 12px 10px; }
  #lines label { display: flex; align-items: center; gap: 8px; padding: 4px 0; font-size: 14px; cursor: pointer; }
  #lines i { display: inline-block; width: 14px; height: 6px; border-radius: 3px; flex: none; }
  #stats { padding: 8px 12px; font-size: 12px; color: #666; border-top: 1px solid #eee; }
</style>
</head>
<body>
<div id="map"></div>
<div id="panel">
  <header>Lignes</header>
  <input type="search" id="filter" placeholder="Filtrer les lignes…">
  <div id="lines"></div>
  <div id="stats">Chargement…</div>
</div>
<script src="assets/leaflet.js"></script>
<script>
(function () {
  var map = L.map('map', { preferCanvas: true }).setView([48.85, 2.35], 10);

  var linesLayer = L.layerGroup().addTo(map);
  var stationsLayer = L.layerGroup().addTo(map);
  var deptLayer = L.layerGroup().addTo(map);
  var fondIGN = L.imageOverlay('assets/ign-idf-fast.webp', [[47.95, 1.3], [49.4, 3.75]], { opacity: 1, interactive: false });
  L.control.layers({}, { 'Fond IGN détaillé': fondIGN }, { position: 'topleft', collapsed: true }).addTo(map);

  var byLine = {};   // line name -> { color, layer }
  var listEl = document.getElementById('lines');
  var statsEl = document.getElementById('stats');

  fetch('assets/network-data.json')
    .then(function (r) {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.json();
    })
    .then(function (data) {
      // Department contours
      L.geoJSON({ type: 'FeatureCollection', features: data.departments }, {
        style: { color: '#888', weight: 1, fillOpacity: 0, dashArray: '4 4' }
      }).addTo(deptLayer);

      // Lines, grouped by name so each one can be toggled
      data.lines.forEach(function (f) {
        var name = f.properties.line;
        var color = '#' + (f.properties.color || '555555');
        if (!byLine[name]) {
          byLine[name] = { color: color, layer: L.layerGroup().addTo(linesLayer), mode: f.properties.mode };
        }
        L.geoJSON(f, { style: { color: color, weight: 3, opacity: 0.9 } }).addTo(byLine[name].layer);
      });

      // Stations as small circles
      data.stations.forEach(function (f) {
        var c = f.geometry.coordinates;
        L.circleMarker([c[1], c[0]], {
          radius: 3, color: '#222', weight: 1, fillColor: '#fff', fillOpacity: 1
        }).bindTooltip(f.properties.name + ' (' + f.properties.line + ')').addTo(stationsLayer);
      });

      buildList();
      statsEl.textContent = data.lines.length + ' tracés · ' + data.stations.length + ' gares';

      var bounds = L.geoJSON({ type: 'FeatureCollection', features: data.lines }).getBounds();
      if (bounds.isValid()) map.fitBounds(bounds, { padding: [20, 20] });
    })
    .catch(function (err) {
      statsEl.textContent = 'Erreur de chargement : ' + err.message;
    });

  function buildList() {
    var names = Object.keys(byLine).sort();
    names.forEach(function (name) {
      var item = byLine[name];
      var label = document.createElement('label');
      var box = document.createElement('input');
      box.type = 'checkbox';
      box.checked = true;
      box.dataset.line = name;
      var swatch = document.createElement('i');
      swatch.style.background = item.color;
      label.appendChild(box);
      label.appendChild(swatch);
      label.appendChild(document.createTextNode(name));
      listEl.appendChild(label);

      box.addEventListener('change', function () {
        if (box.checked) linesLayer.addLayer(item.layer);
        else linesLayer.removeLayer(item.layer);
      });
    });

    document.getElementById('filter').addEventListener('input', function (e) {
      var q = e.target.value.trim().toLowerCase();
      listEl.querySelectorAll('label').forEach(function (label) {
        var text = label.textContent.toLowerCase();
        label.style.display = text.indexOf(q) === -1 ? 'none' : 'flex';
      });
    });
  }
})();
</script>
</body>
</html>
